[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-director"
version = "0.1.0"
description = "Voice-controlled AI stage director: FastAPI backend."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Light voice input only (CPU friendly, no PyTorch needed)
asr = [
    "faster-whisper>=1.0",
]
# Full stack: voice + LLM
ml = [
    "faster-whisper>=1.0",
    "transformers>=4.44",
    "accelerate>=0.30",
]
train = [
    "peft>=0.11",
]
# Kokoro itself is installed separately (see README): its PyPI release caps the Python version.
tts = [
    "soundfile>=0.12",
]
# NVIDIA libraries Whisper needs on GPU machines (Colab). Not needed on CPU.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]